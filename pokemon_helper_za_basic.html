<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>寶可夢ZA 弱點查詢器</title>
  <style>
    body { font-family: sans-serif; background: #f8f9fa; padding: 20px; font-size: 20px; }
    input { font-size: 24px; padding: 8px; width: 80%; margin-bottom: 10px; }
    button { font-size: 24px; padding: 10px; }
    .result { margin-top: 20px; background: #fff; padding: 20px; border-radius: 12px; }
    h2 { font-size: 28px; margin-bottom: 10px; }
    .weakness, .resist, .suggestion { margin-top: 12px; }
  </style>
</head>
<body>
  <h1>📘 寶可夢ZA 弱點查詢器</h1>
  <input type="text" id="inputName" placeholder="輸入寶可夢中文名稱，如：耿鬼">
  <button onclick="lookup()">查詢</button>
  <div id="output" class="result"></div>

  <script>
    const pokemonData = {
      "耿鬼": { "en": "gengar", "types": ["ghost", "poison"] },
      "快龍": { "en": "dragonite", "types": ["dragon", "flying"] },
      "烈咬陸鯊": { "en": "garchomp", "types": ["dragon", "ground"] },
      "皮卡丘": { "en": "pikachu", "types": ["electric"] },
      "噴火龍": { "en": "charizard", "types": ["fire", "flying"] },
      "超能妙喵": { "en": "meowstic", "types": ["psychic"] }
    };

    const typeChart = {
      normal: { rock: 0.5, ghost: 0, steel: 0.5 },
      fire: { fire: 0.5, water: 0.5, grass: 2, ice: 2, bug: 2, rock: 0.5, dragon: 0.5, steel: 2 },
      water: { fire: 2, water: 0.5, grass: 0.5, ground: 2, rock: 2, dragon: 0.5 },
      electric: { water: 2, electric: 0.5, grass: 0.5, ground: 0, flying: 2, dragon: 0.5 },
      grass: { fire: 0.5, water: 2, grass: 0.5, poison: 0.5, ground: 2, flying: 0.5, bug: 0.5, rock: 2, dragon: 0.5, steel: 0.5 },
      ice: { fire: 0.5, water: 0.5, grass: 2, ice: 0.5, ground: 2, flying: 2, dragon: 2, steel: 0.5 },
      fighting: { normal: 2, ice: 2, rock: 2, dark: 2, steel: 2, poison: 0.5, flying: 0.5, psychic: 0.5, bug: 0.5, ghost: 0, fairy: 0.5 },
      poison: { grass: 2, poison: 0.5, ground: 0.5, rock: 0.5, ghost: 0.5, steel: 0, fairy: 2 },
      ground: { fire: 2, electric: 2, grass: 0.5, poison: 2, flying: 0, bug: 0.5, rock: 2, steel: 2 },
      flying: { electric: 0.5, grass: 2, fighting: 2, bug: 2, rock: 0.5, steel: 0.5 },
      psychic: { fighting: 2, poison: 2, psychic: 0.5, dark: 0, steel: 0.5 },
      bug: { fire: 0.5, grass: 2, fighting: 0.5, poison: 0.5, flying: 0.5, psychic: 2, ghost: 0.5, dark: 2, steel: 0.5, fairy: 0.5 },
      rock: { fire: 2, ice: 2, fighting: 0.5, ground: 0.5, flying: 2, bug: 2, steel: 0.5 },
      ghost: { normal: 0, psychic: 2, ghost: 2, dark: 0.5 },
      dragon: { dragon: 2, steel: 0.5, fairy: 0 },
      dark: { fighting: 0.5, psychic: 2, ghost: 2, dark: 0.5, fairy: 0.5 },
      steel: { fire: 0.5, water: 0.5, electric: 0.5, ice: 2, rock: 2, fairy: 2 },
      fairy: { fire: 0.5, fighting: 2, poison: 0.5, dragon: 2, dark: 2, steel: 0.5 }
    };

    function lookup() {
      const name = document.getElementById('inputName').value.trim();
      const mon = pokemonData[name];
      const output = document.getElementById('output');

      if (!mon) {
        output.innerHTML = "查無資料，請確認寶可夢中文名是否正確";
        return;
      }

      let result = `<h2>${name}（${mon.en}）</h2>`;
      result += `<p>屬性：${mon.types.join(" / ")}</p>`;

      const weaknesses = {};
      for (const atkType in typeChart) {
        let mult = 1;
        for (const defType of mon.types) {
          const factor = typeChart[atkType][defType] || 1;
          mult *= factor;
        }
        if (mult > 1) weaknesses[atkType] = mult;
      }

      result += "<div class='weakness'><strong>弱點：</strong>" +
        Object.entries(weaknesses).map(([t, m]) => `${t} (x${m})`).join("、") + "</div>";

      output.innerHTML = result;
    }
  </script>
</body>
</html>
